plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.142'
    id 'com.gradleup.shadow' version '8.3.1'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = "CaffeineMC"
        url = "https://maven.caffeinemc.net/releases"
        content { includeGroup "net.caffeinemc" }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "JDA Maven Central"
                url = "https://repo.maven.apache.org/maven2"
            }
        }
        filter { includeGroup "net.dv8tion" }
    }
    maven {
        name = "FDD Maven"
        url = "https://maven.firstdark.dev/releases"
    }
    maven {
        name = "Illusive Soulworks Maven"
        url = "https://maven.theillusivec4.top/"
        content {
            includeGroup "top.theillusivec4.curios"
        }
    }
    maven {
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        // Official Create libraries (Ponder, and Flywheel as Ponder's runtime dependency).
        name = "CreateMod"
        url = "https://maven.createmod.net"
        content {
            includeGroup "net.createmod.ponder"
            includeGroup "dev.engine-room.flywheel"
        }
    }
    maven {
        name = "BlameJared"
        url = "https://maven.blamejared.com"
        content { includeGroup "mezz.jei" }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "RyanHCode Maven"
                url = "https://maven.ryanhcode.dev/releases"
            }
        }
        filter {
            includeGroup "dev.ryanhcode.sable"
            includeGroup "dev.ryanhcode.sable-companion"
        }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers.add('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Libraries embedded for the dedicated-server Discord bot. This configuration is
// transitive so NeoForge jar-in-jar also carries JDA's required runtime libraries.
configurations {
    discordBotRuntime
    discordBotLibraries
    // The discord-rpc jar whose classes copyDiscordRpcClasses merges into the mod output.
    discordRpcBundle { transitive = false }
}

// Ship the primary GPLv3 license and all bundled third-party notices inside every release JAR.
tasks.named('processResources', ProcessResources) {
    from('changelog.md') {
        into 'assets/moveearth_addtional/menu'
        rename { 'changelog.md' }
    }
    from('warehouse.nbt') {
        into 'data/moveearth_addtional/structure'
    }
    from('THIRD_PARTY_NOTICES.md') {
        into 'META-INF'
    }
    from('LICENSE') {
        into 'META-INF/licenses/moveearth_addtional'
        rename { 'GPL-3.0-only.txt' }
    }
    from('LICENSES') {
        into 'META-INF/licenses/moveearth_addtional'
    }
}


dependencies {
    // Mods supplied by the target modpack, resolved from Modrinth instead of a hand-copied,
    // uncommitted lib/ directory. Each version is byte-identical to the jar lib/ used to hold.
    // `implementation` keeps them on the unit-test and dev-run classpaths as before; none of
    // them is shaded or jar-in-jar'd into the release.
    implementation 'maven.modrinth:create:6.0.10+mc1.21.1'
    implementation 'maven.modrinth:tacz-1.21.1:1.1.8-hotfix-r6'
    implementation 'maven.modrinth:playerrevive:2.1.2'
    // Not referenced by code; only present so dev runs load the pack's recipes and vehicles.
    runtimeOnly 'maven.modrinth:farmers-delight:1.21.1-1.3.3'
    runtimeOnly 'maven.modrinth:create-aeronautics:1.3.2+mc1.21.1'
    implementation 'org.xerial:sqlite-jdbc:3.46.1.3'

    implementation('net.dv8tion:JDA:6.6.0') {
        // MoveEarth never joins voice channels, so native Opus support is unnecessary.
        exclude group: 'club.minnced', module: 'opus-java'
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }
    discordBotRuntime('net.dv8tion:JDA:6.6.0') {
        exclude group: 'club.minnced', module: 'opus-java'
        // Minecraft/NeoForge already provides SLF4J. Embedding another API copy causes conflicts.
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }
    
    // コンパイル時のみ参照し、ランタイムのモジュール解決競合を防ぐ。
    // クラスは copyDiscordRpcClasses がMod出力へ統合する。
    compileOnly 'dev.firstdark.discordrpc:discord-rpc:1.0.4'
    discordRpcBundle 'dev.firstdark.discordrpc:discord-rpc:1.0.4'
    // Create's own block entities implement net.createmod.ponder.api.VirtualBlockEntity,
    // so anything that inspects a Create block entity needs Ponder on the compile
    // classpath even though this mod never calls it. Create 6.0.10 declares ponder
    // [1.0.82,) as a required dependency, so the server always supplies it.
    // This is Create's own Ponder (it also carries Catnip, which CreateLang builds on); the
    // Modrinth "ponder" slug is the unrelated PonderJS addon.
    implementation 'net.createmod.ponder:ponder-neoforge:1.0.82+mc1.21.1'

    // Sable is supplied by the target server; only its API is needed while compiling this mod.
    compileOnly 'dev.ryanhcode.sable:sable-common-1.21.1:2.0.3'
    compileOnly 'dev.ryanhcode.sable-companion:sable-companion-common-1.21.1:1.6.0'

    // Optional Curios integration: the target modpack supplies the full runtime mod.
    compileOnly 'top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1:api'
    // Optional Jade integration. The target modpack supplies Jade at runtime.
    compileOnly 'maven.modrinth:jade:15.10.6+neoforge'
    compileOnly 'net.caffeinemc:sodium-neoforge-api:0.8.12+mc1.21.1'
    // Optional Create: Rock & Stone integration (LGPL-3.0). Its ore deposits are
    // ordinary Minecraft structures, so a region can be enforced by declining to
    // generate one, which is the vanilla contract rather than a reach into
    // another mod's internals. Compiled against, never shipped; the target
    // modpack supplies the mod.
    compileOnly 'maven.modrinth:create-rns:v1.3.1-1.21.1-6'
    // Optional Create: Diesel Generators integration (MIT). Oil is a per-chunk
    // amount gated only by biome tag, so region gating again has to happen in
    // code. The target modpack supplies the mod.
    compileOnly 'maven.modrinth:create-diesel-generators:1.21.1-1.3.15'
    // Optional Cold Sweat API integration. Never bundle Cold Sweat or its assets.
    compileOnly('curse.maven:cold-sweat-506194:8872715') { transitive = false }
    // JEI is supplied by the client modpack. Only its public plugin API is compiled against.
    compileOnly 'mezz.jei:jei-1.21.1-common-api:19.21.1.248'
    compileOnly 'mezz.jei:jei-1.21.1-neoforge-api:19.21.1.248'
    // Optional YetAnotherConfigLib settings screen. The client modpack supplies
    // YACL; without it the mod list falls back to NeoForge's config screen.
    compileOnly 'maven.modrinth:yacl:3.8.2+1.21.1-neoforge'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // Sable armor mass tests use Minecraft's production math library without booting the game.
    testImplementation 'org.joml:joml:1.10.5'
    // Minecraft supplies Gson in production. Standalone unit tests need it on the
    // compile classpath too, because the ore-feature scan is handed a parsed
    // JSON tree and is tested against the document shapes it will really meet.
    testImplementation 'com.google.code.gson:gson:2.11.0'
}

tasks.named('test') {
    useJUnitPlatform()
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// discord-rpc のクラスファイルをModの出力ディレクトリにマージして1つのモジュール化するタスク
var copyDiscordRpcClasses = tasks.register("copyDiscordRpcClasses", Copy) {
    from({ zipTree(configurations.discordRpcBundle.singleFile) }) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/*.RSA'
        // ダミーWinRegistryを使用するため、元々のバグ入りWinRegistry.classを除外
        exclude 'dev/firstdark/rpc/connection/WinRegistry.class'
    }
    into sourceSets.main.output.classesDirs.singleFile
    dependsOn compileJava
}

classes.dependsOn copyDiscordRpcClasses

// Keep JDA's public package stable for the mod classes, but relocate every transitive
// package into a private namespace. A single explicitly named nested module can then
// coexist with any Kotlin/Jackson/Gson/etc. versions supplied by NeoForge or other mods.
def discordRuntimeLicenseIds = [
        'net.dv8tion:JDA'                       : 'Apache-2.0',
        'net.sf.trove4j:core'                   : 'LGPL-2.1',
        'com.fasterxml.jackson.core:jackson-core': 'Apache-2.0',
        'com.fasterxml.jackson.core:jackson-databind': 'Apache-2.0',
        'com.fasterxml.jackson.core:jackson-annotations': 'Apache-2.0',
        'com.google.crypto.tink:tink'           : 'Apache-2.0',
        'com.google.code.findbugs:jsr305'       : 'Apache-2.0',
        'com.google.code.gson:gson'             : 'Apache-2.0',
        'com.google.errorprone:error_prone_annotations': 'Apache-2.0',
        'com.google.protobuf:protobuf-java'     : 'BSD-3-Clause',
        'com.neovisionaries:nv-websocket-client' : 'Apache-2.0',
        'com.squareup.okhttp3:okhttp-jvm'       : 'Apache-2.0',
        'org.jetbrains.kotlin:kotlin-stdlib'    : 'Apache-2.0',
        'org.jetbrains:annotations'              : 'Apache-2.0',
        'com.squareup.okio:okio-jvm'             : 'Apache-2.0',
        'org.apache.commons:commons-collections4': 'Apache-2.0'
]
def discordRuntimeLicenseTexts = [
        'Apache-2.0'  : file('LICENSES/Apache-2.0.txt'),
        'LGPL-2.1'    : file('LICENSES/LGPL-2.1.txt'),
        'BSD-3-Clause': file('LICENSES/BSD-3-Clause-Protobuf.txt')
]
def discordRuntimeArtifacts = project.configurations.discordBotRuntime.resolvedConfiguration.resolvedArtifacts
        .collectEntries { artifact ->
            def id = artifact.moduleVersion.id
            [("${id.group}:${artifact.name}:${id.version}".toString()): artifact.file.absolutePath]
        }
def discordLegalOutput = layout.buildDirectory.dir('generated/discord-runtime-legal')
var prepareDiscordRuntimeLegalFiles = tasks.register('prepareDiscordRuntimeLegalFiles') {
    inputs.files(discordRuntimeArtifacts.values())
    inputs.property('artifactCoordinates', discordRuntimeArtifacts.keySet().sort().join(','))
    inputs.files(discordRuntimeLicenseTexts.values())
    outputs.dir(discordLegalOutput)
    doLast {
        def output = discordLegalOutput.get().asFile
        if (output.exists() && !output.deleteDir()) {
            throw new GradleException("Could not clean generated Discord legal directory: ${output}")
        }
        def found = [] as Set
        discordRuntimeArtifacts.keySet().sort().each { coordinates ->
            def parts = coordinates.split(':')
            def group = parts[0]
            def module = parts[1]
            def version = parts[2]
            def artifactFile = new File(discordRuntimeArtifacts[coordinates])
            def key = "${group}:${module}"
            def licenseId = discordRuntimeLicenseIds[key]
            if (licenseId == null) {
                throw new GradleException("Discord runtime dependency ${coordinates} has no reviewed license entry")
            }
            found.add(key)
            def destination = new File(output, "${group}/${module}/${version}")
            destination.mkdirs()
            new File(destination, 'ABOUT.txt').text =
                    "Component: ${coordinates}\nLicense: ${licenseId}\n" +
                    "Upstream legal files, when present, are preserved under upstream/.\n"
            java.nio.file.Files.copy(discordRuntimeLicenseTexts[licenseId].toPath(),
                    new File(destination, "LICENSE-${licenseId}.txt").toPath())
            new java.util.zip.ZipFile(artifactFile).withCloseable { zip ->
                zip.entries().each { entry ->
                    if (entry.directory) return
                    def name = entry.name
                    def legalPath = !name.contains('/') || name.startsWith('META-INF/')
                    def basename = name.substring(name.lastIndexOf('/') + 1)
                    if (!legalPath || !(basename ==~ /(?i).*?(LICENSE|LICENCE|NOTICE|COPYING|THIRD[-_.]?PARTY).*?/)) return
                    if (name.split('/').contains('..')) {
                        throw new GradleException("Unsafe legal file path in ${artifactFile.name}: ${name}")
                    }
                    def target = new File(destination, "upstream/${name}")
                    target.parentFile.mkdirs()
                    zip.getInputStream(entry).withCloseable { stream ->
                        java.nio.file.Files.copy(stream, target.toPath())
                    }
                }
            }
        }
        if (found != discordRuntimeLicenseIds.keySet()) {
            throw new GradleException("Discord license inventory differs from resolved runtime: " +
                    "missing=${discordRuntimeLicenseIds.keySet() - found}, unexpected=${found - discordRuntimeLicenseIds.keySet()}")
        }
    }
}
var relocateDiscordBotRuntime = tasks.register('relocateDiscordBotRuntime',
        com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    archiveFileName = 'moveearth-discord-runtime-6.6.0.jar'
    destinationDirectory = layout.buildDirectory.dir('discord-libraries')
    configurations = [project.configurations.discordBotRuntime]
    mergeServiceFiles()
    exclude 'module-info.class'
    exclude 'META-INF/versions/**/module-info.class'
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    from(prepareDiscordRuntimeLegalFiles) {
        into 'META-INF/licenses/discord-runtime'
    }

    def privateRoot = 'com.ruskserver.moveearth_addtional.internal.discord'
    relocate 'gnu.trove', "${privateRoot}.trove"
    relocate 'com.fasterxml.jackson', "${privateRoot}.jackson"
    relocate 'com.google.crypto.tink', "${privateRoot}.tink"
    relocate 'com.google.protobuf', "${privateRoot}.protobuf"
    relocate 'com.google.errorprone', "${privateRoot}.errorprone"
    relocate 'com.google.gson', "${privateRoot}.gson"
    relocate 'com.neovisionaries', "${privateRoot}.neovisionaries"
    relocate 'okhttp3', "${privateRoot}.okhttp3"
    relocate 'okio', "${privateRoot}.okio"
    relocate 'kotlin', "${privateRoot}.kotlin"
    relocate 'javax.annotation', "${privateRoot}.javax.annotation"
    relocate 'org.jetbrains.annotations', "${privateRoot}.jetbrains.annotations"
    relocate 'org.intellij.lang.annotations', "${privateRoot}.intellij.lang.annotations"
    relocate 'org.apache.commons.collections4', "${privateRoot}.commons.collections4"

    manifest {
        attributes 'Automatic-Module-Name': 'moveearth.discord.runtime',
                'Implementation-Version': '6.6.0'
    }
}

def relocatedDiscordRuntimeFile = layout.buildDirectory.file(
        'discord-libraries/moveearth-discord-runtime-6.6.0.jar')

var verifyDiscordRuntimeIsolation = tasks.register('verifyDiscordRuntimeIsolation') {
    dependsOn relocateDiscordBotRuntime
    inputs.file(relocatedDiscordRuntimeFile)
    doLast {
        def runtimeJar = relocatedDiscordRuntimeFile.get().asFile
        new java.util.zip.ZipFile(runtimeJar).withCloseable { zip ->
            discordRuntimeArtifacts.keySet().each { coordinates ->
                def parts = coordinates.split(':')
                def directory = "META-INF/licenses/discord-runtime/${parts[0]}/${parts[1]}/${parts[2]}"
                def licenseId = discordRuntimeLicenseIds["${parts[0]}:${parts[1]}"]
                if (zip.getEntry("${directory}/ABOUT.txt") == null ||
                        zip.getEntry("${directory}/LICENSE-${licenseId}.txt") == null) {
                    throw new GradleException("Discord runtime is missing license files for ${coordinates}")
                }
            }
            def leaking = zip.entries().findAll { entry ->
                if (entry.directory || !entry.name.endsWith('.class')) return false
                def classPath = entry.name.replaceFirst('^META-INF/versions/[0-9]+/', '')
                return !classPath.startsWith('net/dv8tion/jda/') &&
                        !classPath.startsWith('com/ruskserver/moveearth_addtional/internal/discord/')
            }.collect { it.name }.take(10)
            if (!leaking.empty) {
                throw new GradleException("Discord runtime exposes classes outside its isolated namespaces: ${leaking}")
            }
        }
        new java.net.URLClassLoader([runtimeJar.toURI().toURL()] as java.net.URL[],
                Thread.currentThread().contextClassLoader).withCloseable { loader ->
            def embedBuilderClass = Class.forName('net.dv8tion.jda.api.EmbedBuilder', true, loader)
            def builder = embedBuilderClass.getConstructor().newInstance()
            embedBuilderClass.getMethod('setTitle', String.class).invoke(builder, 'isolation-smoke-test')
            def embed = embedBuilderClass.getMethod('build').invoke(builder)
            if (embed.getClass().getMethod('getTitle').invoke(embed) != 'isolation-smoke-test') {
                throw new GradleException('Relocated Discord runtime failed its JDA embed smoke test')
            }
            Class.forName('com.ruskserver.moveearth_addtional.internal.discord.okhttp3.OkHttpClient',
                    true, loader)
            Class.forName('com.ruskserver.moveearth_addtional.internal.discord.jackson.databind.ObjectMapper',
                    true, loader)
            Class.forName('com.ruskserver.moveearth_addtional.internal.discord.kotlin.jvm.internal.Intrinsics',
                    true, loader)
        }
    }
}

dependencies {
    discordBotLibraries files(relocateDiscordBotRuntime.flatMap { it.archiveFile })
}

tasks.named('shadowJar') { enabled = false }

tasks.named('jarJar') {
    configuration(project.configurations.discordBotLibraries)
    dependsOn verifyDiscordRuntimeIsolation
}

// The dedicated-server artifact carries the isolated JDA runtime. Clients use the
// player artifact, which contains the same mod classes/protocol but no JDA payload.
tasks.named('jar', Jar) {
    archiveClassifier = 'server'
}

def serverJarFile = tasks.named('jar', Jar).flatMap { it.archiveFile }
var playerJar = tasks.register('playerJar', Jar) {
    group = 'build'
    description = 'Builds the player distribution without the embedded JDA runtime.'
    archiveClassifier = 'player'
    from sourceSets.main.output
    exclude 'com/ruskserver/moveearth_addtional/s2/notification/discord/**'
    // The custom terrain is server side. Its density functions read tile assets
    // that only the server has, so a player build that shipped them would open a
    // single player world onto a flat nothing -- or, before the loader learned to
    // skip, refuse to open one at all. Without the data the world is vanilla, and
    // joining the server is unaffected because worldgen never leaves it.
    exclude 'data/minecraft/worldgen/noise_settings/**'
    exclude 'data/minecraft/worldgen/density_function/**'
    dependsOn tasks.named('classes')
}
def playerJarFile = playerJar.flatMap { it.archiveFile }

var verifyPackagedDiscordRuntime = tasks.register('verifyPackagedDiscordRuntime') {
    dependsOn tasks.named('jar')
    inputs.file(serverJarFile)
    doLast {
        new java.util.zip.ZipFile(serverJarFile.get().asFile).withCloseable { zip ->
            def bundledClientLibraries = zip.entries().findAll { entry ->
                !entry.directory && (entry.name.startsWith('com/momosoftworks/coldsweat/') ||
                        entry.name.startsWith('mezz/jei/'))
            }.collect { it.name }.take(10)
            if (!bundledClientLibraries.empty) {
                throw new GradleException("Server JAR unexpectedly bundles optional client library classes: ${bundledClientLibraries}")
            }
            def nested = zip.entries().findAll { entry ->
                !entry.directory && entry.name.startsWith('META-INF/jarjar/') &&
                        entry.name.endsWith('.jar')
            }.collect { it.name }
            if (nested != ['META-INF/jarjar/moveearth-discord-runtime-6.6.0.jar']) {
                throw new GradleException("Release JAR has unexpected nested libraries: ${nested}")
            }
            def metadataEntry = zip.getEntry('META-INF/jarjar/metadata.json')
            def metadata = metadataEntry == null ? '' : zip.getInputStream(metadataEntry).getText('UTF-8')
            if (metadata.contains('jsr305-3.0.2.jar') ||
                    metadata.contains('error_prone_annotations-2.22.0.jar') ||
                    metadata.contains('kotlin-stdlib-2.2.21.jar')) {
                throw new GradleException('Release JAR contains a legacy unisolated Discord dependency')
            }
        }
    }
}

var verifyPlayerDistribution = tasks.register('verifyPlayerDistribution') {
    dependsOn playerJar
    inputs.file(playerJarFile)
    doLast {
        new java.util.zip.ZipFile(playerJarFile.get().asFile).withCloseable { zip ->
            def forbidden = zip.entries().findAll { entry ->
                !entry.directory && (entry.name.startsWith('META-INF/jarjar/') ||
                        entry.name.startsWith('net/dv8tion/jda/') ||
                        entry.name.startsWith('com/momosoftworks/coldsweat/') ||
                        entry.name.startsWith('mezz/jei/') ||
                        entry.name.startsWith('com/ruskserver/moveearth_addtional/s2/notification/discord/'))
            }.collect { it.name }.take(10)
            if (!forbidden.empty) {
                throw new GradleException("Player JAR contains Discord server runtime entries: ${forbidden}")
            }
            if (zip.getEntry('dev/firstdark/rpc/DiscordRpc.class') == null) {
                throw new GradleException('Player JAR is missing the client Discord RPC runtime')
            }
            def terrainData = zip.entries().findAll { entry ->
                !entry.directory && (entry.name.startsWith('data/minecraft/worldgen/noise_settings/') ||
                        entry.name.startsWith('data/minecraft/worldgen/density_function/'))
            }.collect { it.name }.take(10)
            if (!terrainData.empty) {
                throw new GradleException("Player JAR ships server-only worldgen data: ${terrainData}")
            }
            ['C2S_LinkDiscordAccountPacket.class', 'C2S_LinkNationDiscordPacket.class'].each { className ->
                def entry = zip.getEntry("com/ruskserver/moveearth_addtional/network/c2s/nation/${className}")
                if (entry == null) throw new GradleException("Player JAR is missing ${className}")
                def bytes = zip.getInputStream(entry).bytes
                def constants = new String(bytes, java.nio.charset.StandardCharsets.ISO_8859_1)
                if (constants.contains('DiscordBotService') || constants.contains('net/dv8tion/jda')) {
                    throw new GradleException("Common packet ${className} directly references the JDA implementation")
                }
            }
            def leakedJdaReferences = zip.entries().findAll { entry ->
                if (entry.directory || !entry.name.endsWith('.class')) return false
                def bytes = zip.getInputStream(entry).bytes
                return new String(bytes, java.nio.charset.StandardCharsets.ISO_8859_1)
                        .contains('net/dv8tion/jda')
            }.collect { it.name }.take(10)
            if (!leakedJdaReferences.empty) {
                throw new GradleException("Player JAR class files still reference JDA: ${leakedJdaReferences}")
            }
        }
    }
}

// overworld.json is generated by tools/terrain/make_noise_settings.py and git-ignored, so a clean
// checkout builds a server JAR without it: the game starts fine but new chunks lose the climate layers.
var verifyServerTerrain = tasks.register('verifyServerTerrain') {
    dependsOn tasks.named('jar')
    inputs.file(serverJarFile)
    doLast {
        new java.util.zip.ZipFile(serverJarFile.get().asFile).withCloseable { zip ->
            if (zip.getEntry('data/minecraft/worldgen/noise_settings/overworld.json') == null) {
                throw new GradleException('Server JAR is missing data/minecraft/worldgen/noise_settings/overworld.json. '
                        + 'Run tools/terrain/make_noise_settings.py before building a release server JAR.')
            }
        }
    }
}

tasks.register('buildServerJar') {
    group = 'build'
    description = 'Builds and verifies the dedicated-server distribution with embedded JDA and terrain data.'
    dependsOn verifyPackagedDiscordRuntime, verifyServerTerrain
}

tasks.register('buildPlayerJar') {
    group = 'build'
    description = 'Builds and verifies the JDA-free player distribution.'
    dependsOn verifyPlayerDistribution
}

// assemble is the everyday build, so it runs every distribution check: a server JAR
// without the terrain noise settings would generate new chunks without their climate.
tasks.named('assemble') {
    dependsOn verifyPackagedDiscordRuntime, verifyPlayerDistribution, verifyServerTerrain
}
